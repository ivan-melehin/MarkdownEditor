</head>

<body>
    <div class="app">
        <div class="toolbar" id="toolbar">
            <!-- Заголовки H1, H2, H3 -->
            <button data-action="h1">H1</button>
            <button data-action="h2">H2</button>
            <button data-action="h3">H3</button>
            <div class="sep"></div>
            <!-- Форматирование -->
            <button data-action="bold"><b>B</b></button>
            <button data-action="italic"><i>I</i></button>
            <button data-action="bolditalic"><b><i>BI</i></b></button>
            <button data-action="strike"><s>S</s></button>
            <button data-action="code">`</button>
            <button data-action="codeblock">```</button>
            <div class="sep"></div>
            <!-- Вставка -->
            <button data-action="link">🔗</button>
            <button data-action="image">🖼️</button>
            <button data-action="checkbox">☑️</button>
            <button data-action="ol">1.</button>
            <button data-action="ul">•</button>
            <button data-action="quote">“</button>
            <button data-action="hr">—</button>
            <button data-action="table">▦</button>
            <div class="sep"></div>
            <!-- Undo / Redo -->
            <button id="undoBtn" class="undo-redo-btn" title="Отменить (Ctrl+Z)">↩️</button>
            <button id="redoBtn" class="undo-redo-btn" title="Вернуть (Ctrl+Y)">↪️</button>
            <div class="sep"></div>
            <div class="right-buttons">
                <button id="copyBtn">📋 Копировать</button>
                <button id="clearBtn">🧹 Очистить</button>
                <button id="themeToggle" class="theme-toggle" title="Сменить тему">🌙</button>
            </div>
        </div>

        <div class="editor-panel">
            <div class="editor">
                <textarea id="markdownInput" placeholder="Введите Markdown..."></textarea>
            </div>
            <div class="preview" id="preview"></div>
        </div>

        <div class="status-bar">
            <span id="stats">Символов: 0 &nbsp; Слов: 0</span>
            <button class="feedback-btn" onclick="openFeedback()">Обратная связь</button>
            <span>💾 автоматическое сохранение</span>
        </div>
        <div class="test-notice">
            ⚠️ Проект находится на стадии тестирования. Возможны ошибки и некорректная работа отдельных функций.
        </div>
    </div>

    <!-- Форма обратной связи -->
    <div class="feedback-modal" id="feedbackModal">
        <div class="feedback-box">
            <button class="feedback-close" onclick="closeFeedback()">×</button>
            <h3>Обратная связь</h3>
            <p>Нашли ошибку или хотите предложить улучшение?</p>
            <form action="https://formspree.io/f/xrpbgyyn" method="POST">
                <input type="email" name="email" placeholder="Ваш email (необязательно)">
                <textarea name="message" placeholder="Сообщение" required></textarea>
                <button class="feedback-submit" type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
